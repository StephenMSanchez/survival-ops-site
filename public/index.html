<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>STAC-OPS // Access Required</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="brand-banner">
    <div class="scanline"></div>
    <div class="brand-title"><a href="#home">STAC&#8209;OPS</a></div>
    <div class="brand-subtitle"><a href="#survival" data-id="survival">SURVIVAL</a> &middot; <a href="#technical" data-id="technical">TECHNICAL</a> &middot; <a href="#tactical" data-id="tactical">TACTICAL</a></div>
  </header>

  <div id="gate" class="gate">
    <div class="gate-card">
      <h1>Restricted Access</h1>
      <p class="muted">Log in with your username and passcode to see the sections you're cleared for. Leave username blank and enter the rotating code instead for full temporary access.</p>
      <form id="gate-form" autocomplete="off">
        <input id="username-input" type="text" inputmode="text" placeholder="Username" autocomplete="off" />
        <input id="passcode-input" type="password" inputmode="text" placeholder="Passcode" autocomplete="off" required />
        <button type="submit">Unlock</button>
      </form>
      <p id="gate-error" class="error" hidden></p>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <nav id="nav" class="nav">
      <div class="nav-title">Menu</div>
      <ul id="nav-list"></ul>
      <button id="admin-btn" class="lock-btn" type="button" hidden>Admin</button>
      <button id="lock-btn" class="lock-btn" type="button">Lock site</button>
    </nav>
    <main id="content" class="content"></main>
  </div>

  <div id="access-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <p class="modal-title">Access Denied</p>
      <p id="access-modal-message">You do not have clearance for this section.</p>
      <button id="access-modal-dismiss" type="button">Dismiss</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
